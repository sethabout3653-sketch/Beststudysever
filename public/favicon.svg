<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer container with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Graduation Cap Icon -->
  <g filter="url(#glow)" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cap Diamond top -->
    <polygon points="32,18 52,26 32,34 12,26" fill="none"/>
    <!-- Cap base / skullcap -->
    <path d="M20,29.5 L20,38 C20,44 44,44 44,38 L44,29.5" fill="none"/>
    <!-- Tassel -->
    <path d="M32,26 L45,34 L45,41" stroke-width="2.5" fill="none"/>
  </g>
  <!-- Center star/dot -->
  <circle cx="32" cy="26" r="2.5" fill="#ffffff"/>
</svg>
